---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: youtrack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"

spec:
  project: applications

  source:
    repoURL: "https://github.com/NullMonkeys/k3s-gitops.git"
    targetRevision: HEAD
    path: applications/youtrack

  destination:
    server: https://kubernetes.default.svc
    namespace: youtrack

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
