---
image:
  flavor: apache

replicaCount: 1

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  tls:
    - secretName: nextcloud-tls
      hosts:
        - cloud.nullmonkeys.com

phpClientHttpsFix:
  enabled: true
  protocol: https

nextcloud:
  host: cloud.nullmonkeys.com

  existingSecret:
    enabled: true
    secretName: nextcloud-secrets
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password

  mail:
    enabled: false

  objectStore:
    s3:
      enabled: true
      host: seaweedfs-s3.seaweedfs.svc.cluster.local
      port: "8333"
      ssl: false
      bucket: "nextcloud"
      usePathStyle: true
      autoCreate: false
      existingSecret: nextcloud-s3
      secretKeys:
        host: ""
        accessKey: accessKey
        secretKey: secretKey
        bucket: ""
        sse_c_key: ""

  configs: {}

  strategy:
    type: Recreate

  extraEnv:
    - name: OVERWRITECLIURL
      value: "https://cloud.nullmonkeys.com"

    - name: APACHE_DISABLE_REWRITE_IP
      value: "1"

    - name: TRUSTED_PROXIES
      value: "10.42.0.0/16"

  hooks:
    before-starting: |
      #!/bin/bash
      set -eu

      OCC="php /var/www/html/occ"

      ensure_app() {
        app="$1"

        if ! $OCC app:getpath "$app" >/dev/null 2>&1; then
          echo "Installing Nextcloud app: $app"
          $OCC app:install "$app"
        fi

        if ! $OCC app:list --enabled | grep -qE "^[[:space:]]*-[[:space:]]+${app}:"; then
          echo "Enabling Nextcloud app: $app"
          $OCC app:enable "$app"
        fi
      }

      ensure_disabled() {
        app="$1"

        if $OCC app:list --enabled | grep -qE "^[[:space:]]*-[[:space:]]+${app}:"; then
          echo "Disabling Nextcloud app: $app"
          $OCC app:disable "$app"
        fi
      }

      ensure_disabled spreed

      ensure_app user_oidc
      ensure_app calendar
      ensure_app collectives
      ensure_app deck
      ensure_app tasks
      ensure_app tables
      ensure_app notes
      ensure_app richdocuments

persistence:
  enabled: true
  storageClass: longhorn
  accessMode: ReadWriteOnce
  size: 8Gi

internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  existingSecret:
    enabled: true
    secretName: "nextcloud-db-app"
    usernameKey: "username"
    passwordKey: "password"
    hostKey: "host"
    databaseKey: "dbname"

externalRedis:
  enabled: true
  host: redis-master
  port: "6379"
  existingSecret:
    enabled: true
    secretName: nextcloud-secrets
    passwordKey: redis-password

collabora:
  enabled: true
  collabora:
    aliasgroups:
      - host: "https://cloud.nullmonkeys.com:443"

    extra_params: >-
      --o:ssl.enable=false
      --o:ssl.termination=true

    server_name: office.nullmonkeys.com

    existingSecret:
      enabled: true
      secretName: nextcloud-secrets
      usernameKey: "collabora-username"
      passwordKey: "collabora-password"

  ingress:
    enabled: true
    className: traefik

    annotations:
      cert-manager.io/cluster-issuer: letsencrypt

    hosts:
      - host: office.nullmonkeys.com
        paths:
          - path: /
            pathType: ImplementationSpecific

    tls:
      - secretName: collabora-tls
        hosts:
          - office.nullmonkeys.com

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 3Gi

cronjob:
  enabled: true
  type: cronjob

  cronjob:
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - nextcloud
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - app
            topologyKey: kubernetes.io/hostname

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 4Gi

metrics:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus:
  serviceMonitor:
    enabled: true
    interval: 30s

  rules:
    enabled: true
