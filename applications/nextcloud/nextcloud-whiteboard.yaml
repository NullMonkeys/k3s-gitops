---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: whiteboard-server
  namespace: nextcloud

spec:
  replicas: 1

  selector:
    matchLabels:
      app: whiteboard-server

  template:
    metadata:
      labels:
        app: whiteboard-server

    spec:
      containers:
        - name: whiteboard
          image: ghcr.io/nextcloud-releases/whiteboard:stable

          ports:
            - name: http
              containerPort: 3002

          env:
            - name: NEXTCLOUD_URL
              value: https://cloud.nullmonkeys.com

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: whiteboard-jwt-secret

            - name: STORAGE_STRATEGY
              value: lru

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

---
apiVersion: v1
kind: Service

metadata:
  name: whiteboard-server
  namespace: nextcloud

spec:
  selector:
    app: whiteboard-server

  ports:
    - name: http
      port: 3002
      targetPort: 3002

---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: whiteboard-server
  namespace: nextcloud
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt

spec:
  ingressClassName: traefik

  tls:
    - secretName: whiteboard-tls
      hosts:
        - whiteboard.nullmonkeys.com

  rules:
    - host: whiteboard.nullmonkeys.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whiteboard-server
                port:
                  number: 3002
