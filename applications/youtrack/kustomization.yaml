---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: youtrack

resources: []

helmCharts:
  - name: youtrack
    repo: https://twenty-20.github.io/helm-charts/
    version: 4.3.6
    releaseName: youtrack
    namespace: youtrack
    valuesFile: youtrack-values.yaml

patches:
  - target:
      kind: PersistentVolumeClaim
      name: youtrack-backup
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: youtrack-backup
        labels:
          recurring-job.longhorn.io/source: "enabled"
          recurring-job.longhorn.io/nightly-backup: "enabled"

  - target:
      kind: PersistentVolumeClaim
      name: youtrack-config
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: youtrack-config
        labels:
          recurring-job.longhorn.io/source: "enabled"
          recurring-job.longhorn.io/nightly-backup: "enabled"
