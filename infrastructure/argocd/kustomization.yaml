---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/install.yaml
  - ingress.yaml
  - servicemonitor.yaml

configMapGenerator:
  - name: argocd-cmd-params-cm
    behavior: merge
    literals:
      - server.insecure="true"

  - name: argocd-cm
    behavior: merge
    literals:
      - kustomize.buildOptions="--enable-helm"
    files:
      - resource.customizations.ignoreDifferences.all=argocd-ignore-mariadb.txt
