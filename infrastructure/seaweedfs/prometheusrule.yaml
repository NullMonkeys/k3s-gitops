---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: seaweedfs
  labels:
    release: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  groups:
    - name: seaweedfs.availability
      rules:
        - alert: SeaweedFSComponentUnavailable
          expr: |
            max by (namespace, service) (
              up{namespace="seaweedfs",service=~"seaweedfs-(master|volume|filer|s3)|seaweedfs-operator"}
            ) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'SeaweedFS component {{ $labels.service }} is unavailable'
            description: 'No scrape endpoint for {{ $labels.service }} has been reachable for 5 minutes. Inspect its pods and PVCs.'
        - alert: SeaweedFSMetricsMissing
          expr: |
            absent(up{namespace="seaweedfs",service="seaweedfs-master"})
            or absent(up{namespace="seaweedfs",service="seaweedfs-volume"})
            or absent(up{namespace="seaweedfs",service="seaweedfs-filer"})
            or absent(up{namespace="seaweedfs",service="seaweedfs-s3"})
            or absent(up{namespace="seaweedfs",service="seaweedfs-operator"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'SeaweedFS scrape target {{ $labels.service }} is missing'
            description: 'Prometheus has no target for {{ $labels.service }}. Check ServiceMonitor discovery, Services, and pods.'
        - alert: SeaweedFSVolumeUnhealthy
          expr: |
            max by (volume, pvc, pvc_namespace, state) (
              longhorn_volume_robustness{pvc_namespace="seaweedfs",state=~"degraded|faulted|unknown"}
            ) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'SeaweedFS PVC {{ $labels.pvc }} is unhealthy'
            description: 'Longhorn reports {{ $labels.state }} for {{ $labels.pvc }}. This deployment has only one replica; inspect disk and node health.'
    - name: seaweedfs.capacity
      rules:
        - alert: SeaweedFSPVCUsageHigh
          expr: |
            max by (namespace, persistentvolumeclaim) (
              kubelet_volume_stats_used_bytes{namespace="seaweedfs"}
              / kubelet_volume_stats_capacity_bytes{namespace="seaweedfs"}
            ) > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'SeaweedFS PVC {{ $labels.persistentvolumeclaim }} is above 80% usage'
            description: 'Plan PVC expansion and check physical Longhorn capacity before expanding.'
        - alert: SeaweedFSPVCUsageCritical
          expr: |
            max by (namespace, persistentvolumeclaim) (
              kubelet_volume_stats_used_bytes{namespace="seaweedfs"}
              / kubelet_volume_stats_capacity_bytes{namespace="seaweedfs"}
            ) > 0.9
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'SeaweedFS PVC {{ $labels.persistentvolumeclaim }} is above 90% usage'
            description: 'Writes may stop. Expand the PVC after checking Longhorn capacity, or reclaim unused data through SeaweedFS maintenance.'
        - alert: SeaweedFSLogicalVolumesHigh
          expr: |
            sum by (namespace, pod) (SeaweedFS_volumeServer_volumes{namespace="seaweedfs"})
            / max by (namespace, pod) (SeaweedFS_volumeServer_max_volumes{namespace="seaweedfs"}) > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'SeaweedFS logical volume allocation is above 80%'
            description: 'Inspect allocated collections and disk usage. Empty or partially filled volumes also consume allocation slots.'
        - alert: SeaweedFSLogicalVolumesCritical
          expr: |
            sum by (namespace, pod) (SeaweedFS_volumeServer_volumes{namespace="seaweedfs"})
            / max by (namespace, pod) (SeaweedFS_volumeServer_max_volumes{namespace="seaweedfs"}) > 0.9
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'SeaweedFS logical volume allocation is above 90%'
            description: 'New writes may run out of allocation slots. Increase the limit only after expanding storage and checking physical capacity.'
