---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: seaweedfs

resources:
  - storageclass.yaml
  - cluster.yaml
  - nextcloud-access-grant.yaml
  - nextcloud-bucket.yaml

helmCharts:
  - name: seaweedfs-operator
    repo: https://seaweedfs.github.io/seaweedfs-operator
    version: 0.1.43
    releaseName: seaweedfs-operator
    namespace: seaweedfs
    valuesFile: seaweedfs-operator-values.yaml
