rule_files:
- rules.yaml
evaluation_interval: 1m
tests:
- name: healthy and below thresholds
  interval: 1m
  input_series:
  - series: up{namespace="seaweedfs",service="seaweedfs-master"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-volume"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-filer"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-s3"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-operator"}
    values: 1+0x20
  - series: kubelet_volume_stats_used_bytes{namespace="seaweedfs",persistentvolumeclaim="data"}
    values: 79+0x20
  - series: kubelet_volume_stats_capacity_bytes{namespace="seaweedfs",persistentvolumeclaim="data"}
    values: 100+0x20
  - series: SeaweedFS_volumeServer_volumes{namespace="seaweedfs",pod="seaweedfs-volume-0",collection="app",type="normal"}
    values: 47+0x20
  - series: SeaweedFS_volumeServer_max_volumes{namespace="seaweedfs",pod="seaweedfs-volume-0"}
    values: 60+0x20
  - series: longhorn_volume_robustness{pvc_namespace="seaweedfs",pvc="data",volume="pv",state="healthy"}
    values: 1+0x20
  alert_rule_test:
  - eval_time: 15m
    alertname: SeaweedFSComponentUnavailable
    exp_alerts: []
  - eval_time: 15m
    alertname: SeaweedFSMetricsMissing
    exp_alerts: []
  - eval_time: 15m
    alertname: SeaweedFSVolumeUnhealthy
    exp_alerts: []
  - eval_time: 15m
    alertname: SeaweedFSPVCUsageHigh
    exp_alerts: []
  - eval_time: 15m
    alertname: SeaweedFSPVCUsageCritical
    exp_alerts: []
  - eval_time: 15m
    alertname: SeaweedFSLogicalVolumesHigh
    exp_alerts: []
  - eval_time: 15m
    alertname: SeaweedFSLogicalVolumesCritical
    exp_alerts: []
- name: unreachable component must persist five minutes
  interval: 1m
  input_series:
  - series: up{namespace="seaweedfs",service="seaweedfs-master"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-volume"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-filer"}
    values: 0+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-s3"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-operator"}
    values: 1+0x20
  alert_rule_test:
  - eval_time: 4m
    alertname: SeaweedFSComponentUnavailable
    exp_alerts: []
  - eval_time: 6m
    alertname: SeaweedFSComponentUnavailable
    exp_alerts:
    - exp_labels:
        namespace: seaweedfs
        service: seaweedfs-filer
        severity: critical
      exp_annotations:
        summary: SeaweedFS component seaweedfs-filer is unavailable
        description: No scrape endpoint for seaweedfs-filer has been reachable for
          5 minutes. Inspect its pods and PVCs.
- name: target discovery lost
  interval: 1m
  input_series:
  - series: up{namespace="seaweedfs",service="seaweedfs-master"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-volume"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-filer"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-operator"}
    values: 1+0x20
  alert_rule_test:
  - eval_time: 6m
    alertname: SeaweedFSMetricsMissing
    exp_alerts:
    - exp_labels:
        namespace: seaweedfs
        service: seaweedfs-s3
        severity: warning
      exp_annotations:
        summary: SeaweedFS scrape target seaweedfs-s3 is missing
        description: Prometheus has no target for seaweedfs-s3. Check ServiceMonitor
          discovery, Services, and pods.
- name: critical storage and slot utilization
  interval: 1m
  input_series:
  - series: up{namespace="seaweedfs",service="seaweedfs-master"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-volume"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-filer"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-s3"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-operator"}
    values: 1+0x20
  - series: kubelet_volume_stats_used_bytes{namespace="seaweedfs",persistentvolumeclaim="data"}
    values: 95+0x20
  - series: kubelet_volume_stats_capacity_bytes{namespace="seaweedfs",persistentvolumeclaim="data"}
    values: 100+0x20
  - series: SeaweedFS_volumeServer_volumes{namespace="seaweedfs",pod="seaweedfs-volume-0",collection="app",type="normal"}
    values: 55+0x20
  - series: SeaweedFS_volumeServer_max_volumes{namespace="seaweedfs",pod="seaweedfs-volume-0"}
    values: 60+0x20
  alert_rule_test:
  - eval_time: 11m
    alertname: SeaweedFSPVCUsageHigh
    exp_alerts:
    - exp_labels:
        namespace: seaweedfs
        persistentvolumeclaim: data
        severity: warning
      exp_annotations:
        summary: SeaweedFS PVC data is above 80% usage
        description: Plan PVC expansion and check physical Longhorn capacity before
          expanding.
  - eval_time: 11m
    alertname: SeaweedFSPVCUsageCritical
    exp_alerts:
    - exp_labels:
        namespace: seaweedfs
        persistentvolumeclaim: data
        severity: critical
      exp_annotations:
        summary: SeaweedFS PVC data is above 90% usage
        description: Writes may stop. Expand the PVC after checking Longhorn capacity,
          or reclaim unused data through SeaweedFS maintenance.
  - eval_time: 11m
    alertname: SeaweedFSLogicalVolumesHigh
    exp_alerts:
    - exp_labels:
        namespace: seaweedfs
        pod: seaweedfs-volume-0
        severity: warning
      exp_annotations:
        summary: SeaweedFS logical volume allocation is above 80%
        description: Inspect allocated collections and disk usage. Empty or partially
          filled volumes also consume allocation slots.
  - eval_time: 11m
    alertname: SeaweedFSLogicalVolumesCritical
    exp_alerts:
    - exp_labels:
        namespace: seaweedfs
        pod: seaweedfs-volume-0
        severity: critical
      exp_annotations:
        summary: SeaweedFS logical volume allocation is above 90%
        description: New writes may run out of allocation slots. Increase the limit
          only after expanding storage and checking physical capacity.
- name: faulted single-copy volume
  interval: 1m
  input_series:
  - series: up{namespace="seaweedfs",service="seaweedfs-master"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-volume"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-filer"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-s3"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-operator"}
    values: 1+0x20
  - series: longhorn_volume_robustness{pvc_namespace="seaweedfs",pvc="data",volume="pv",state="faulted"}
    values: 1+0x20
  alert_rule_test:
  - eval_time: 6m
    alertname: SeaweedFSVolumeUnhealthy
    exp_alerts:
    - exp_labels:
        pvc_namespace: seaweedfs
        pvc: data
        volume: pv
        state: faulted
        severity: critical
      exp_annotations:
        summary: SeaweedFS PVC data is unhealthy
        description: Longhorn reports faulted for data. This deployment has only one
          replica; inspect disk and node health.
- name: recovered component clears alert
  interval: 1m
  input_series:
  - series: up{namespace="seaweedfs",service="seaweedfs-master"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-volume"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-s3"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-operator"}
    values: 1+0x20
  - series: up{namespace="seaweedfs",service="seaweedfs-filer"}
    values: 0+0x6 1+0x14
  alert_rule_test:
  - eval_time: 6m
    alertname: SeaweedFSComponentUnavailable
    exp_alerts:
    - exp_labels:
        namespace: seaweedfs
        service: seaweedfs-filer
        severity: critical
      exp_annotations:
        summary: SeaweedFS component seaweedfs-filer is unavailable
        description: No scrape endpoint for seaweedfs-filer has been reachable for
          5 minutes. Inspect its pods and PVCs.
  - eval_time: 8m
    alertname: SeaweedFSComponentUnavailable
    exp_alerts: []
