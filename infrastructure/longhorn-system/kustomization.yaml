---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secrets.yaml
  - nightly-backup.yaml
  - networkpolicy-monitoring.yaml

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.12.1
    releaseName: longhorn
    valuesFile: values.yaml
    namespace: longhorn-system
    includeCRDs: true

namespace: longhorn-system
