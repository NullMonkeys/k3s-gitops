---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

resources:
  - authentik-secrets.yaml
  - postgres-cluster.yaml
  - postgres-backup.yaml

helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io/
    version: 2026.8.0
    releaseName: authentik
    namespace: authentik
    valuesFile: authentik-values.yaml

patches:
  - path: postgres-patch-recovery.yaml
  # - path: postgres-patch-init.yaml
